name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Library metadata (arduino-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: submit
          compliance: specification

  compile:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The sketches linked by the TinkerBlink widget docs, plus Serial
          - name: Arduino Uno
            fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
            libraries: |
              - source-path: ./
              - name: Ethernet
              - name: Servo
              - name: Time
            sketch-paths: |
              - examples/GettingStarted
              - examples/Widgets
              - examples/More/Sync
              - examples/Boards_USB_Serial/Arduino_Serial_USB

          - name: ESP8266 core 3.x
            fqbn: esp8266:esp8266:nodemcuv2
            platforms: |
              - name: esp8266:esp8266
                source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/ESP8266_Standalone
              - examples/Boards_WiFi/ESP8266_Standalone_Manual_IP
              - examples/Boards_WiFi/ESP8266_Standalone_SSL

          - name: ESP8266 core 2.7.4
            fqbn: esp8266:esp8266:nodemcuv2
            platforms: |
              - name: esp8266:esp8266
                source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
                version: 2.7.4
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/ESP8266_Standalone
              - examples/Boards_WiFi/ESP8266_Standalone_SSL

          - name: ESP32 core 3.x
            fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/ESP32_WiFi
              - examples/Boards_WiFi/ESP32_WiFi_SSL

          - name: ESP32 core 2.0
            fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
                version: 2.0.17
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/ESP32_WiFi
              - examples/Boards_WiFi/ESP32_WiFi_SSL

          - name: LOLIN S2 Mini (ESP32-S2)
            fqbn: esp32:esp32:lolin_s2_mini
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/ESP32_WiFi
              - examples/Boards_WiFi/ESP32_WiFi_SSL

          - name: ESP32-S3
            fqbn: esp32:esp32:esp32s3
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/ESP32_WiFi
              - examples/Boards_WiFi/ESP32_WiFi_SSL

          - name: ESP32-C3 SuperMini
            fqbn: esp32:esp32:nologo_esp32c3_super_mini
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/ESP32_WiFi
              - examples/Boards_WiFi/ESP32_WiFi_SSL

          - name: ESP32-C6
            fqbn: esp32:esp32:esp32c6
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/ESP32_WiFi
              - examples/Boards_WiFi/ESP32_WiFi_SSL

          - name: Arduino Nano ESP32
            fqbn: arduino:esp32:nano_nora
            platforms: |
              - name: arduino:esp32
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/ESP32_WiFi
              - examples/Boards_WiFi/ESP32_WiFi_SSL

          - name: Arduino UNO R4 WiFi
            fqbn: arduino:renesas_uno:unor4wifi
            platforms: |
              - name: arduino:renesas_uno
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/Arduino_UNO_R4_WiFi

          - name: Arduino GIGA R1 WiFi
            fqbn: arduino:mbed_giga:giga
            platforms: |
              - name: arduino:mbed_giga
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/Arduino_GIGA_R1_WiFi

          - name: Arduino Nano RP2040 Connect
            fqbn: arduino:mbed_nano:nanorp2040connect
            platforms: |
              - name: arduino:mbed_nano
            libraries: |
              - source-path: ./
              - name: WiFiNINA
            sketch-paths: |
              - examples/Boards_WiFi/Arduino_Nano_RP2040_Connect

          - name: Raspberry Pi Pico W
            fqbn: rp2040:rp2040:rpipicow
            platforms: |
              - name: rp2040:rp2040
                source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/RaspberryPi_Pico_W
              - examples/Boards_WiFi/RaspberryPi_Pico_W_SSL

          - name: Raspberry Pi Pico 2 W
            fqbn: rp2040:rp2040:rpipico2w
            platforms: |
              - name: rp2040:rp2040
                source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/RaspberryPi_Pico_W
              - examples/Boards_WiFi/RaspberryPi_Pico_W_SSL

    steps:
      - uses: actions/checkout@v5
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          libraries: ${{ matrix.libraries }}
          sketch-paths: ${{ matrix.sketch-paths }}
          cli-compile-flags: |
            - --warnings
            - default
          enable-warnings-report: true

  linux:
    name: Linux client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make -C linux

  linux-gpiod:
    name: Linux client, libgpiod ${{ matrix.gpiod }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gpiod: 1.x
            image: debian:bookworm
          - gpiod: 2.x
            image: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: apt-get update && apt-get install -y build-essential pkg-config libgpiod-dev
      - name: Build
        run: |
          pkg-config --modversion libgpiod
          make -C linux target=gpiod DEVICE="Raspberry Pi 4 B/400"
