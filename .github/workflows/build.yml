name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Library metadata (arduino-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: submit
          compliance: specification

  compile:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The sketches linked by the TinkerBlink widget docs, plus Serial
          - name: Arduino Uno
            fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
            libraries: |
              - source-path: ./
              - name: Ethernet
              - name: Servo
              - name: Time
            sketch-paths: |
              - examples/GettingStarted
              - examples/Widgets
              - examples/More/Sync
              - examples/Boards_USB_Serial/Arduino_Serial_USB

          - name: ESP8266 core 3.x
            fqbn: esp8266:esp8266:nodemcuv2
            platforms: |
              - name: esp8266:esp8266
                source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/ESP8266_Standalone
              - examples/Boards_WiFi/ESP8266_Standalone_Manual_IP
              - examples/Boards_WiFi/ESP8266_Standalone_SSL

          - name: ESP8266 core 2.7.4
            fqbn: esp8266:esp8266:nodemcuv2
            platforms: |
              - name: esp8266:esp8266
                source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
                version: 2.7.4
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/ESP8266_Standalone
              - examples/Boards_WiFi/ESP8266_Standalone_SSL

          - name: ESP32 core 3.x
            fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/ESP32_WiFi
              - examples/Boards_WiFi/ESP32_WiFi_SSL

          - name: ESP32 core 2.0
            fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
                version: 2.0.17
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/Boards_WiFi/ESP32_WiFi
              - examples/Boards_WiFi/ESP32_WiFi_SSL

    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          libraries: ${{ matrix.libraries }}
          sketch-paths: ${{ matrix.sketch-paths }}
          cli-compile-flags: |
            - --warnings
            - default
          enable-warnings-report: true

  linux:
    name: Linux client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -C linux
